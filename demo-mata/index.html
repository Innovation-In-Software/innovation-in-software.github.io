<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Modern Automation with Terraform and Ansible (DEMO) — class accounts</title>
<!--
  Class page (2026-10-21): everything a student needs for the class on one link + one password,
  one tab per resource, live 2FA codes on the row they belong to. For lab VMs that block the
  clipboard to the host and can't reach Google Sheets. Same encryption as the codes page
  (AES-256-GCM; key from the page password via PBKDF2-SHA256, 200k iterations).

  Bundle v4:
    {v:4, title, intro,
     tabs: [{id, name, note, columns:[{key, label}], code_label?}],      // code_label → live TOTP column
     rows: [{seat, name, cells:{tabId:{key:value}}, codes:{tabId:{s,d,a}}}]}
  Bundle v3 (single table) is still accepted.
-->
<style>
  :root { --bg:#0f172a; --panel:#1e293b; --panel-2:#334155; --text:#e2e8f0; --muted:#94a3b8;
          --accent:#38bdf8; --code:#4ade80; --error:#f87171; --border:#475569; }
  * { box-sizing:border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
               font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  .container { max-width:1240px; margin:0 auto; padding:28px 20px; }
  h1 { margin:0 0 6px; font-size:24px; font-weight:600; }
  .sub { color:var(--muted); font-size:14px; margin-bottom:22px; }
  .prompt { background:var(--panel); border-radius:12px; padding:32px; max-width:460px; }
  .prompt label { display:block; font-size:14px; color:var(--muted); margin-bottom:8px; }
  .prompt input, .search input { width:100%; padding:12px 14px; border-radius:8px; border:1px solid var(--border);
    background:var(--panel-2); color:var(--text); font-size:16px; font-family:inherit; }
  .prompt input:focus, .search input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent); }
  .prompt button { margin-top:16px; width:100%; padding:12px; border-radius:8px; border:none; background:var(--accent);
    color:#0f172a; font-size:16px; font-weight:600; cursor:pointer; font-family:inherit; }
  .error { color:var(--error); font-size:14px; margin-top:12px; min-height:20px; }
  .bar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .search { flex:1; min-width:260px; }
  .timer { display:flex; align-items:center; gap:10px; background:var(--panel); border-radius:10px; padding:8px 14px; }
  .timer[hidden] { display:none; }
  .ring { position:relative; width:36px; height:36px; }
  .ring svg { transform:rotate(-90deg); }
  .ring circle { fill:none; stroke-width:4; }
  .ring .track { stroke:var(--panel-2); }
  .ring .progress { stroke:var(--accent); stroke-linecap:round; transition:stroke-dashoffset .9s linear; }
  .ring-text { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; font-weight:600; font-variant-numeric:tabular-nums; }
  .timer .t { font-size:13px; color:var(--muted); }
  .intro { color:var(--muted); font-size:13px; margin:0 0 14px; }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
  .tab { padding:9px 16px; border-radius:8px; border:1px solid var(--border); background:var(--panel);
         color:var(--muted); font-size:14px; font-weight:600; cursor:pointer; font-family:inherit; }
  .tab:hover { color:var(--text); }
  .tab.active { background:var(--accent); border-color:var(--accent); color:#0f172a; }
  .note { background:var(--panel); border-left:3px solid var(--accent); border-radius:8px; padding:10px 14px;
          color:var(--text); font-size:13px; margin:0 0 12px; line-height:1.5; }
  .note code { font-family:"SF Mono",Menlo,Consolas,monospace; background:var(--panel-2); padding:1px 5px; border-radius:4px; }
  .note[hidden] { display:none; }
  .wrap { overflow-x:auto; border-radius:12px; }
  table { width:100%; border-collapse:collapse; background:var(--panel); }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--panel-2); vertical-align:middle; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); font-weight:600; white-space:nowrap; }
  tr:last-child td { border-bottom:none; }
  tr.hidden { display:none; }
  td.seat { color:var(--muted); font-size:13px; white-space:nowrap; }
  td.name { font-size:15px; white-space:nowrap; }
  .val { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:13.5px; cursor:pointer; user-select:all;
         padding:3px 6px; border-radius:6px; white-space:nowrap; }
  .val:hover { background:var(--panel-2); }
  .val.copied::after, .code.copied::after { content:" ✓"; color:var(--code); font-family:inherit; font-size:13px; }
  a.lnk { color:var(--accent); font-size:13px; margin-left:4px; text-decoration:none; }
  .code { font-family:"SF Mono",Menlo,Consolas,monospace; font-size:20px; color:var(--code);
          font-variant-numeric:tabular-nums; letter-spacing:.05em; cursor:pointer; user-select:all; white-space:nowrap; }
  td { white-space:nowrap; }
  .card { background:var(--panel); border-radius:12px; padding:6px 0; }
  .card[hidden] { display:none; }
  .card .who { padding:12px 18px 6px; font-size:17px; font-weight:600; }
  .card .who span { color:var(--muted); font-weight:400; font-size:14px; margin-left:8px; }
  .card .kv { display:grid; grid-template-columns:200px 1fr; gap:6px 16px; padding:10px 18px; border-top:1px solid var(--panel-2); align-items:center; }
  .card .k { color:var(--muted); font-size:13px; text-transform:uppercase; letter-spacing:.04em; }
  .card .v { word-break:break-all; }
  .card .v .val { white-space:normal; word-break:break-all; }
  .footer { margin-top:16px; font-size:12px; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<div class="container">
  <h1>Modern Automation with Terraform and Ansible (DEMO)</h1>
  <div class="sub">Your class accounts and live 2FA codes</div>

  <div id="prompt" class="prompt">
    <label for="pw">Page password (from your instructor)</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus>
    <button id="unlock-btn">Unlock</button>
    <div class="error" id="error"></div>
  </div>

  <div id="content" hidden>
    <div class="bar">
      <div class="search"><input id="q" placeholder="Type your name, lab VM or seat to see only your row…" autocomplete="off"></div>
      <div class="timer" id="timer" hidden>
        <div class="ring">
          <svg width="36" height="36"><circle class="track" cx="18" cy="18" r="14"></circle>
          <circle id="ring-progress" class="progress" cx="18" cy="18" r="14" stroke-dasharray="87.96" stroke-dashoffset="0"></circle></svg>
          <div class="ring-text" id="countdown">30</div>
        </div>
        <span class="t">New 2FA codes every 30 s</span>
      </div>
    </div>
    <p class="intro" id="intro"></p>
    <div class="tabs" id="tabs"></div>
    <div class="note" id="note" hidden></div>
    <div class="card" id="card" hidden></div>
    <div class="wrap" id="tablewrap"><table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table></div>
    <p class="footer">Click any value or code to copy it. Use a 2FA code before the timer runs out.</p>
  </div>
</div>

  const DEMO_PASSWORD = "";   // empty on real pages; set only on fake-data demos
  const PBKDF2_ITERATIONS = 200000, PERIOD = 30;

  function b64toBytes(b64) { const s = atob(b64), o = new Uint8Array(s.length);
    for (let i = 0; i < s.length; i++) o[i] = s.charCodeAt(i); return o; }
  const B32 = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  function b32(b) { const c = b.toUpperCase().replace(/=+$/, "").replace(/\s+/g, ""); let bits = "";
    for (const ch of c) { const i = B32.indexOf(ch); if (i < 0) throw new Error("bad base32"); bits += i.toString(2).padStart(5, "0"); }
    const o = new Uint8Array(Math.floor(bits.length / 8));
    for (let i = 0; i < o.length; i++) o[i] = parseInt(bits.substr(i * 8, 8), 2); return o; }
  const keyCache = new Map();
  async function hkey(e) { const id = e.a + ":" + e.s; if (keyCache.has(id)) return keyCache.get(id);
    const hash = { SHA1: "SHA-1", SHA256: "SHA-256", SHA512: "SHA-512" }[e.a] || "SHA-1";
    const k = await crypto.subtle.importKey("raw", b32(e.s), { name: "HMAC", hash }, false, ["sign"]);
    keyCache.set(id, k); return k; }
  async function totp(e, t) { const ctr = Math.floor(t / PERIOD), buf = new ArrayBuffer(8), v = new DataView(buf);
    v.setUint32(0, Math.floor(ctr / 0x100000000)); v.setUint32(4, ctr >>> 0);
    const h = new Uint8Array(await crypto.subtle.sign("HMAC", await hkey(e), buf)), off = h[h.length - 1] & 15;

    const d = e.d === 8 ? 8 : 6; return String(n % Math.pow(10, d)).padStart(d, "0"); }

  function normalise(d) {

  // One person found → show their details as a card (no sideways scrolling); otherwise the table.
  function filter() {

    const i = +hits[0].dataset.i, r = data.rows[i], cells = (r.cells || {})[current.id] || {};

      if (!cells[c.key]) continue;
      const k = document.createElement("div"); k.className = "k"; k.textContent = c.label;
      const v = document.createElement("div"); v.className = "v"; v.appendChild(valueEl(cells[c.key]));
      kv.appendChild(k); kv.appendChild(v);
    }
    if (current.code_label && (r.codes || {})[current.id]) {
      const k = document.createElement("div"); k.className = "k"; k.textContent = current.code_label;
      const v = document.createElement("div"); v.className = "v"; v.appendChild(codeEl(i)); kv.appendChild(k); kv.appendChild(v);
    }
    card.appendChild(kv);
    render();
  }
  function showTab(id) {
    current = data.tabs.find((t) => t.id === id) || data.tabs[0];
    try { sessionStorage.setItem("cp-tab", current.id); } catch (_) {}
    for (const b of document.querySelectorAll(".tab")) b.classList.toggle("active", b.dataset.id === current.id);
    const note = document.getElementById("note");
    note.hidden = !current.note; note.innerHTML = "";
    if (current.note) {   // `text` → <code>, everything else as text
      current.note.split(/(`[^`]+`)/).forEach((part) => {
        if (/^`[^`]+`$/.test(part)) { const c = document.createElement("code"); c.textContent = part.slice(1, -1); note.appendChild(c); }
        else note.appendChild(document.createTextNode(part));
      });
    }
    const head = document.getElementById("head"); head.textContent = "";
    const labels = ["Seat", "Name"].concat(current.columns.map((c) => c.label));
    if (current.code_label) labels.push(current.code_label);
    for (const l of labels) { const th = document.createElement("th"); th.textContent = l; head.appendChild(th); }
    const body = document.getElementById("body"); body.textContent = "";
    data.rows.forEach((r, i) => {
      const tr = document.createElement("tr"); tr.dataset.i = i;
      const vmish = Object.values(r.cells || {}).map((t) => Object.values(t).join(" ")).join(" ");
      tr.dataset.find = [r.seat, r.name, vmish].join(" ").toLowerCase();
      const td = (cls, text) => { const c = document.createElement("td"); if (cls) c.className = cls; if (text) c.textContent = text; tr.appendChild(c); return c; };
      td("seat", r.seat); td("name", r.name);
      const cells = (r.cells || {})[current.id] || {};
      for (const c of current.columns) {
        const cell = td(), v = cells[c.key];
        if (v) cell.appendChild(valueEl(v));
      }
      if (current.code_label) {
        const cell = td(), e = (r.codes || {})[current.id];
        if (e) cell.appendChild(codeEl(i));
      }
      body.appendChild(tr);
    });
    document.getElementById("timer").hidden = !current.code_label;
    filter();
  }
  async function render() {
    if (!current || !current.code_label) return;
    const now = Math.floor(Date.now() / 1000), tab = current.id;
    for (const el of document.querySelectorAll("#card .code, #body tr:not(.hidden) .code")) {
      const e = (data.rows[+el.dataset.i].codes || {})[tab];
      const c = fmt(await totp(e, now));
      if (current.id !== tab) return;
      if (!el.classList.contains("copied") && el.textContent !== c) el.textContent = c;
    }
  }
  function tick() {
    const now = Date.now() / 1000, inP = now % PERIOD;
    document.getElementById("ring-progress").setAttribute("stroke-dashoffset", 2 * Math.PI * 14 * (inP / PERIOD));
    document.getElementById("countdown").textContent = Math.ceil(PERIOD - inP);
    render();
  }
  async function unlock(pwOverride) {
    const pw = pwOverride || document.getElementById("pw").value, err = document.getElementById("error");
    err.textContent = "";
    try { data = normalise(await decrypt(pw)); } catch (e) { err.textContent = "Incorrect password."; return; }
    document.getElementById("prompt").hidden = true;
    document.getElementById("content").hidden = false;
    document.getElementById("intro").textContent = data.intro || "";
    const bar = document.getElementById("tabs");
    bar.hidden = data.tabs.length < 2;
    for (const t of data.tabs) { const b = document.createElement("button"); b.className = "tab"; b.dataset.id = t.id;
      b.textContent = t.name; b.addEventListener("click", () => showTab(t.id)); bar.appendChild(b); }
    let saved = null, q = "";
    try { saved = sessionStorage.getItem("cp-tab"); q = sessionStorage.getItem("cp-q") || ""; } catch (_) {}
    document.getElementById("q").value = q;
    document.getElementById("q").addEventListener("input", filter);
    showTab(saved);
    tick(); setInterval(tick, 1000);
  }
  document.getElementById("unlock-btn").addEventListener("click", () => unlock());
  document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
  if (DEMO_PASSWORD && DEMO_PASSWORD.indexOf("__") !== 0) unlock(DEMO_PASSWORD);
})();
</script>
